# Include this file only from the existing tupzjianzhao.chat HTTPS server block.
# It does not change the production /api/ route, which continues to proxy to
# 127.0.0.1:8000. The trailing slash deliberately strips the staging prefix so
# FastAPI still receives its normal /api/... routes.

location = /alipay-staging-v1 {
    return 308 /alipay-staging-v1/;
}

location ^~ /alipay-staging-v1/ {
    proxy_pass http://127.0.0.1:18001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /alipay-staging-v1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
}

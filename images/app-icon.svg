<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="312" y="380" width="400" height="300" rx="40" fill="white" opacity="0.95"/>
  <!-- Camera lens -->
  <circle cx="512" cy="530" r="70" fill="#e8eaed"/>
  <circle cx="512" cy="530" r="50" fill="#c0c4cc"/>
  <circle cx="512" cy="530" r="35" fill="#667eea"/>
  <circle cx="512" cy="530" r="20" fill="#764ba2"/>
  <!-- Flash -->
  <circle cx="680" cy="420" r="15" fill="#ffd700"/>
  <!-- ID card outline -->
  <rect x="350" y="620" width="324" height="220" rx="16" fill="none" stroke="white" stroke-width="8" opacity="0.5"/>
  <!-- Person silhouette inside card -->
  <circle cx="512" cy="680" r="30" fill="white" opacity="0.3"/>
  <ellipse cx="512" cy="750" rx="40" ry="25" fill="white" opacity="0.3"/>
  <!-- Checkmark -->
  <path d="M 440 730 L 500 790 L 590 700" fill="none" stroke="#4ade80" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
